<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap">
  <!-- Nav-bar styling is SHARED: site.css is the single source of truth for `.site-nav` and its
       children (icons, title font, spacing, colours). map.css then layers only map-specific chrome
       and re-pins the bar as a fixed-height band. This ends the content-vs-map nav drift. -->
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="map.css">
  <!-- Reading-order (`__podOrder__`) for the ‹‹/›› arrows and the search dialog behind 🔎,
       shared with every built page. Both are served per-project under this same /site/. -->
  <script src="pods.js"></script>
  <script src="nav.js"></script>
</head>
<body>
  <nav class="site-nav" data-pod-filename="map">
    <!-- Leading title filled at runtime from window.__siteTitle__ (pods.js) by nav.js. -->
    <span class="nav-title"></span>
    <div class="nav-right">
      <!-- Lucide line-art (https://lucide.dev, ISC): house / search / chevron-left / chevron-right. Kept in sync with SiteHTML.swift. -->
      <a class="nav-home" href="toc.html" aria-label="Contents" title="Contents"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></a>
      <button type="button" class="nav-search-btn" onclick="seedNavOpenSearch()" aria-label="Search" title="Search"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
      <span class="header-nav-prev header-nav-disabled" data-pod-nav="prev" aria-hidden="true" title="Previous"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></span>
      <span class="header-nav-next header-nav-disabled" data-pod-nav="next" aria-hidden="true" title="Next"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span>
    </div>
  </nav>
  <!-- Numbered, hue-coloured page title ("11.4 Map"); filled + tinted at runtime from graph.json. -->
  <div class="map-title" id="map-title"></div>
  <div class="map-controls">
    <input id="filter" class="filter" type="text" placeholder="filter… (e.g. 6.)" autocomplete="off" spellcheck="false">
    <!-- Degrees-of-separation filter: 0 = show every node (incl. disconnected);
         D≥1 = the centered node plus everything within D hops of it. -->
    <label class="degrees" title="Show nodes within N degrees of the center (0 = all)">
      <span class="degrees-label">degrees</span>
      <input id="degrees" class="degrees-input" type="number" min="0" step="1" value="0" inputmode="numeric" autocomplete="off">
    </label>
    <!-- undo/redo and the zoom cluster are each an inner nowrap flex, so a line
         break can never split a pair — each wraps as one unit. -->
    <span class="nav-group">
      <button id="undo" type="button" title="Undo">&#8634;</button>
      <button id="redo" type="button" title="Redo">&#8635;</button>
    </span>
    <span class="spacer"></span>
    <span class="hint">click = menu · hover = highlight · drag = move · double-click = open</span>
    <span class="spacer"></span>
    <span class="zoom-group">
      <button id="zoom-out" type="button">&minus;</button>
      <button id="zoom-in" type="button">+</button>
      <span id="zoom-level" class="zoom-level">1.00×</span>
    </span>
  </div>
  <div id="map" class="map-host"></div>

  <!--
    Data load: over http(s) the engine fetches `graph.json` (the builder writes
    one per project next to this file). Opened straight off disk (fetch is
    CORS-blocked under file://), it falls back to window.__GRAPH__ from
    graph.data.js — so a developer can just double-click map.html. The fallback
    is requested ONLY under file://, so the served copy stays clean (no 404).
  -->
  <script>if (location.protocol === "file:") document.write('<scr' + 'ipt src="graph.data.js"><\/scr' + 'ipt>');</script>
  <script src="map.js"></script>
</body>
</html>
