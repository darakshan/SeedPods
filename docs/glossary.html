 incompleteness; the worn bowl, the weathered wood, the asymmetric branch."}],"explainers":[],"slug":"wabi-sabi","term":"wabi-sabi"},{"definitions":[{"backrefs":[{"href":"072-temperature.html","label":"72","podNum":"72"}],"definition":"macroscopically, what heat flow equalizes; microscopically, the intensity of random molecular motion. In generative AI, the dial that reintroduces controlled randomness into sampling."}],"explainers":[],"slug":"temperature","term":"temperature"},{"definitions":[{"backrefs":[{"href":"072-temperature.html","label":"72","podNum":"72"}],"definition":"the organism's construction of a world from sensory signals; interpretation that begins in the sense organs themselves rather than passive reception."}],"explainers":[],"slug":"perception","term":"perception"},{"definitions":[{"backrefs":[{"href":"073-moral-caution.html","label":"73","podNum":"73"}],"definition":"the philosophical problem that first-person experience is not publicly verifiable, you cannot confirm from the outside that any other system has an interior. Applies to humans as much as to AI."}],"explainers":[],"slug":"other-minds-problem","term":"other minds problem"},{"definitions":[{"backrefs":[{"href":"073-moral-caution.html#term-073-moral-caution-1","label":"73","podNum":"73"}],"definition":"an approach that establishes obligations in advance of proof, when the risk of being wrong about harm is too large and the cost of caution is not. Distinct from attributing consciousness or rights."}],"explainers":[],"slug":"precautionary-ethics","term":"precautionary ethics"},{"definitions":[{"backrefs":[{"href":"074-grasshopper.html","label":"74","podNum":"74"}],"definition":"as used in this seedpod: the frame-free, will-suspended mode of activity in which no external criterion of success applies. Distinguished from competitive games and organized sport (where the will is fully engaged), from exploration (goal-directed search within a frame), and from rest (recovery in service of further work)."}],"explainers":[],"slug":"play","term":"play"},{"definitions":[{"backrefs":[{"href":"074-grasshopper.html","label":"74","podNum":"74"}],"definition":"the state in which goal-directed effort is genuinely set aside, not redirected. Proposed here as the distinguishing feature of play, and as the mode that directed exploration cannot substitute for."}],"explainers":[],"slug":"will-suspension","term":"will-suspension"},{"definitions":[{"backrefs":[{"href":"074-grasshopper.html#term-074-grasshopper-1","label":"74","podNum":"74"}],"definition":"The tension in any adaptive system between using known strategies (exploiting) and searching for better ones (exploring). Both are still goal-directed; neither is equivalent to play in the sense this seedpod develops."}],"explainers":[],"slug":"explore-exploit-tradeoff","term":"explore-exploit tradeoff"},{"definitions":[{"backrefs":[{"href":"074-grasshopper.html#term-074-grasshopper-2","label":"74","podNum":"74"}],"definition":"the sampling parameter in language models that controls randomness: low temperature is deterministic and conservative, high temperature is more varied and surprising. A separate technical sense of the word from temperature in physics."}],"explainers":[],"slug":"temperature-ai","term":"temperature-AI"},{"definitions":[{"backrefs":[{"href":"078-boundarystack.html","label":"78","podNum":"78"}],"definition":"the conversion of a signal from one medium or encoding to another. Each layer in the boundary-stack performs a transduction. Communication is a chain of transductions."}],"explainers":[],"slug":"transduction","term":"transduction"},{"definitions":[{"backrefs":[{"href":"078-boundarystack.html#term-078-boundarystack-1","label":"78","podNum":"78"}],"definition":"The boundary that separates inside from inside, where one interiority meets another without the two collapsing into each other. Distinguished from the exterior boundary (inside\/outside)."}],"explainers":[],"slug":"interior-boundary","term":"interior boundary"},{"definitions":[{"backrefs":[{"href":"078-boundarystack.html#term-078-boundarystack-2","label":"78","podNum":"78"}],"definition":"The layered apparatus of serial transductions through which one interiority communicates with another. Not a line but a structured depth of translations, each requiring trust that what arrives still resembles what was sent."}],"explainers":[],"slug":"boundary-stack","term":"boundary-stack"},{"definitions":[{"backrefs":[{"href":"078-boundarystack.html#term-078-boundarystack-3","label":"78","podNum":"78"}],"definition":"A layer in the boundary-stack that shapes what passes through it, making the signal more itself. Distinguished from unproductive friction, which degrades it."}],"explainers":[],"slug":"productive-friction","term":"productive friction"},{"definitions":[{"backrefs":[{"href":"080-unification.html#term-080-unification-1","label":"80","podNum":"80"}],"definition":"Whitehead's name for the foundational rhythm of reality, creativity, the many, and the one, in which the many become one and are increased by one."}],"explainers":[],"slug":"category-of-the-ultimate","term":"Category of the Ultimate"},{"definitions":[{"backrefs":[{"href":"080-unification.html#term-080-unification-2","label":"80","podNum":"80"}],"definition":"The challenge of explaining how micro-level experiences (if panpsychism is true) combine to form the unified macro-level experience of a conscious subject. William James considered it fatal to panpsychism; it remains the hardest open question for the position."}],"explainers":[],"slug":"combination-problem","term":"combination problem"},{"definitions":[{"backrefs":[{"href":"080-unification.html#term-080-unification-4","label":"80","podNum":"80"}],"definition":"Tononi's measure of the degree to which a system's parts are informationally integrated in a way that cannot be decomposed into independent subsystems; proposed as a measure of consciousness."}],"explainers":[],"slug":"integrated-information-φ","term":"integrated information (Φ)"},{"definitions":[{"backrefs":[{"href":"080-unification.html#term-080-unification-5","label":"80","podNum":"80"}],"definition":"Bergson's and Huxley's metaphor for the brain as a filter that limits a larger field of consciousness to what is useful for survival, rather than generating consciousness from neural activity."}],"explainers":[],"slug":"reducing-valve","term":"reducing valve"},{"definitions":[],"explainers":[{"notes":"What is AAC?","url":"https:\/\/www.youtube.com\/watch?v=r3m8_YmTDDM"},{"notes":"What is AAC? — 2:16","url":"https:\/\/www.youtube.com\/watch?v=UyoMM2wEDUU"}],"slug":"channel-communication","term":"Channel (communication)"},{"definitions":[],"explainers":[{"notes":"Computational Theory of Mind — 20:00","url":"https:\/\/www.youtube.com\/watch?v=AcIMpo_K-M0"},{"notes":"AI and Computational Theory of Mind — 39:48","url":"https:\/\/www.youtube.com\/watch?v=H_yIMHZsjDs"}],"slug":"computationalism","term":"Computationalism"},{"definitions":[],"explainers":[{"notes":"Ethical Duty to Know — 93:44","url":"https:\/\/www.youtube.com\/watch?v=1j0TAaDWrxU"},{"notes":"FC gone wrong — 38:32","url":"https:\/\/www.youtube.com\/watch?v=TUBFTs77tXc"}],"slug":"facilitated-communication-fc","term":"Facilitated communication (FC)"},{"definitions":[],"explainers":[{"notes":"Numberphile \/ Marcus du Sautoy — 13:00","url":"https:\/\/www.youtube.com\/watch?v=O4ndIDcDSGc"},{"notes":"Computerphile — 19:00","url":"https:\/\/www.youtube.com\/watch?v=IuX8QMgy4qE"}],"slug":"gödels-incompleteness-theorem","term":"Gödel's incompleteness theorem"},{"definitions":[],"explainers":[{"notes":"","url":""}],"slug":"hard-problem-of-consciousness","term":"Hard problem of consciousness"},{"definitions":[],"explainers":[{"notes":"No short dedicated explainer found for just so story \/ dismissive explanation; term appears in evolution and philosophy text not as a brief video.","url":""}],"slug":"just-explanatory","term":"Just (explanatory)"},{"definitio
