<script type="application/json" id="gossamer-gloss-json">[{"definitions":[{"backrefs":[{"href":"001-caloric.html#term-001-caloric-1","label":"1","podNum":"1"}],"definition":"attributed to Max Planck. A version appears in his Scientific Autobiography (1949): \"A new scientific truth does not triumph by convincing its opponents and making them see the light, but rather because its opponents eventually die and a new generation grows up that is familiar with it.\""}],"explainers":[{"notes":"Does Science Advance One Funeral at a Time? — 7:00","url":"https:\/\/www.youtube.com\/watch?v=yzAEsRajfp4"}],"slug":"science-advances-one-funeral-at-a-time","term":"science advances one funeral at a time"},{"definitions":[{"backrefs":[{"href":"001-caloric.html#term-001-caloric-2","label":"1","podNum":"1"}],"definition":"a scholar who studies how scientific knowledge actually develops over time, treating science as a human activity shaped by communities, paradigms, and crises rather than as a steady accumulation of objective discoveries."}],"explainers":[],"slug":"history-of-science","term":"history-of-science"},{"definitions":[{"backrefs":[{"href":"001-caloric.html#term-001-caloric-3","label":"1","podNum":"1"}],"definition":"Thomas Kuhn's term for the revolutionary replacement of one scientific framework by another, as distinct from normal cumulative progress. From The Structure of Scientific Revolutions (1962, University of Chicago Press)."}],"explainers":[{"notes":"Yale \/ Loncar — 50:30","url":"https:\/\/www.youtube.com\/watch?v=7gI25jArTgo"},{"notes":"Sociology Crash Course — 4:06","url":"https:\/\/www.youtube.com\/watch?v=B1fpRn3mZ9U"},{"notes":"The New Enlightenment — 10:00","url":"https:\/\/www.youtube.com\/watch?v=tJD5RMpIw18"}],"slug":"paradigm-shift","term":"paradigm shift"},{"definitions":[{"backrefs":[{"href":"001-caloric.html#term-001-caloric-4","label":"1","podNum":"1"},{"href":"021-just.html#term-021-just-2","label":"21","podNum":"21"}],"definition":"Whitehead's term for the error of mistaking a useful abstraction for the concrete reality it was abstracted from. The paradigm case: treating the particle, an abstraction useful for calculation, as the fundamental unit of nature. Appears throughout Process and Reality (1929)."},{"backrefs":[{"href":"002-events.html#term-002-events-2","label":"2","podNum":"2"}],"definition":"fallacy of misplaced concreteness"}],"explainers":[{"notes":"map vs territory","url":"https:\/\/www.youtube.com\/watch?v=lG9hSB0EuqU"}],"slug":"fallacy-of-misplaced-concreteness","term":"fallacy of misplaced concreteness"},{"definitions":[{"backrefs":[{"href":"008-fields.html#term-008-fields-1","label":"8","podNum":"8"},{"href":"001-caloric.html#term-001-caloric-5","label":"1","podNum":"1"},{"href":"025-widechannel.html#term-025-widechannel-2","label":"25","podNum":"25"},{"href":"052-dichotomy.html","label":"52","podNum":"52"},{"href":"069-love.html#term-069-love-1","label":"69","podNum":"69"}],"definition":"the having of experience; what it is like to be the system from the inside. Used here in the broadest sense, ranging from the unified awareness of a human moment to whatever minimal interiority an actual occasion may possess. Distinct from intelligence, attention, or behavioral sophistication; those are signs of consciousness in some cases and absent in others."}],"explainers":[],"slug":"consciousness","term":"consciousness"},{"definitions":[{"backrefs":[{"href":"001-caloric.html#term-001-caloric-6","label":"1","podNum":"1"}],"definition":"philosopher David Chalmers' term for the question of why physical processes give rise to subjective experience at all. From Facing Up to the Problem of Consciousness, Journal of Consciousness Studies (1995)."}],"explainers":[],"slug":"hard-problem","term":"hard problem"},{"definitions":[{"backrefs":[{"href":"001-caloric.html#term-001-caloric-7","label":"1","podNum":"1"},{"href":"011-moreisdifferent.html#term-011-moreisdifferent-3","label":"11","podNum":"11"},{"href":"017-pastpresent.html#term-017-pastpresent-2","label":"17","podNum":"17"},{"href":"022-locked.html#term-022-locked-9","label":"22","podNum":"22"},{"href":"025-widechannel.html#term-025-widechannel-3","label":"25","podNum":"25"},{"href":"047-ai-feeling.html#term-047-ai-feeling-1","label":"47","podNum":"47"},{"href":"048-flashes.html#term-048-flashes-2","label":"48","podNum":"48"},{"href":"065-feel-do.html#term-065-feel-do-1","label":"65","podNum":"65"},{"href":"072-temperature.html","label":"72","podNum":"72"}],"definition":"artificial intelligence as it actually exists in the mid-2020s: large language models, neural networks, and related systems trained on vast amounts of human-produced data. Not the science-fiction figure of a self-aware machine, but something more disorienting: a substrate that produces fluent, contextual, sometimes insightful responses without anyone being able to say whether anything is happening inside it. The arrival of these systems forces the question of whether experience requires biological substrate, and at what point we are obliged to treat the question seriously."}],"explainers":[],"slug":"ai","term":"AI"},{"definitions":[{"backrefs":[{"href":"002-events.html#term-002-events-1","label":"2","podNum":"2"},{"href":"052-dichotomy.html","label":"52","podNum":"52"}],"definition":"in quantum field theory, the fundamental entities are fields that pervade space. Particles are localized excitations of these fields, brought into being by interactions and resolved by others. The field is ontologically primary; the particle is a derived event."}],"explainers":[{"notes":"EM waves from Maxwell — 20:14","url":"https:\/\/www.youtube.com\/watch?v=PhuJubU1aRs"},{"notes":"Fermilab \/ Don Lincoln — 5:00","url":"https:\/\/www.youtube.com\/watch?v=FBeALt3rxEA"}],"slug":"quantum-field","term":"quantum field"},{"definitions":[{"backrefs":[{"href":"003-inside.html#term-003-inside-2","label":"3","podNum":"3"},{"href":"002-events.html#term-002-events-3","label":"2","podNum":"2"},{"href":"004-self.html#term-004-self-4","label":"4","podNum":"4"},{"href":"009-randomness.html#term-009-randomness-11","label":"9","podNum":"9"},{"href":"016-neuralnetwork.html#term-016-neuralnetwork-2","label":"16","podNum":"16"},{"href":"052-dichotomy.html","label":"52","podNum":"52"}],"definition":"Alfred North Whitehead's term for the fundamental unit of reality: a discrete event of becoming that takes in its environment, integrates it, and completes itself. Enduring objects are families (Whitehead: \"societies\") of actual occasions stable enough to appear permanent. The occasion is primary; the object is derivative."}],"explainers":[{"notes":"","url":""}],"slug":"actual-occasion","term":"actual occasion"},{"definitions":[{"backrefs":[{"href":"002-events.html#term-002-events-4","label":"2","podNum":"2"}],"definition":"Carlo Rovelli's interpretation of quantum mechanics, in which quantum states are relative to observers or measuring systems rather than absolute. Properties do not exist independently of interactions."}],"explainers":[],"slug":"relational-quantum-mechanics","term":"relational quantum mechanics"},{"definitions":[{"backrefs":[{"href":"002-events.html","label":"2","podNum":"2"}],"definition":"Wittgenstein's term for the way members of a category (chairs, games, languages) share overlapping similarities without any single feature common to all. The category is held together by a web of resemblances, not by a shared essence."}],"explainers":[{"notes":"","url":""}],"slug":"family-resemblance","term":"family resemblance"},{"definitions":[{"backrefs":[{"href":"003-inside.html#term-003-inside-1","label":"3","podNum":"3"}],"definition":"what it is like from the inside; the felt aspect of a process, taken in this book as a candidate fundamental feature of reality rather than a late biological product."}],"explainers":[],"slug":"experience","term":"experience"},{"definitions":[{"backrefs":[{"href":"003-inside.html#term-003-inside-3","label":"3","podNum":"3"},{"href":"004-self.html#term-004-self-2","label":"4","podNum":"4"},{"href":"007-vacuum.html#term-007-vacuum-4","label":"7","podNum":"7"},{"href":"008-fields.html","label":"8","podNum":"8"},{"href":"013-enactment.html#term-013-enactment-2","label":"13","podNum":"13"},{"href":"016-neuralnetwork.html#term-016-neuralnetwork-3","label":"16","podNum":"16"},{"href":"017-pastpresent.html#term-017-pastpresent-3","label":"17","podNum":"17"},{"href":"028-network.html#term-028-network-6","label":"28","podNum":"28"},{"href":"050-orthogonal.html#term-050-orthogonal-2","label":"50","podNum":"50"},{"href":"080-unification.html#term-080-unification-3","label":"80","podNum":"80"}],"definition":"Whitehead's term for the way each actual occasion takes in and registers what surrounds it before completing itself; the basic relational act of reality. Plain English equivalent: feeling, taking-in. The root is the same as \"apprehend.\""}],"explainers":[],"slug":"prehension","term":"prehension"},{"definitions":[{"backrefs":[{"href":"003-inside.html#term-003-inside-4","label":"3","podNum":"3"},{"href":"028-network.html#term-028-network-7","label":"28","podNum":"28"}],"definition":"the philosophical position that experience or mind is a fundamental and ubiquitous feature of reality, not a late biological product. Distinguished from animism (which attributes spirits or agency to natural objects) by its grounding in rigorous argument rather than cultural tradition."}],"explainers":[{"notes":"","url":""}],"slug":"panpsychism","term":"panpsychism"},{"definitions":[{"backrefs":[{"href":"004-self.html#term-004-self-1","label":"4","podNum":"4"}],"definition":"the apparent owner of experience; on inspection not a thing but a pattern, a society of occasions re-forming moment to moment. Hume looked and found only the bundle."}],"explainers":[],"slug":"self","term":"self"},{"definitions":[{"backrefs":[{"href":"004-self.html#term-004-self-3","label":"4","podNum":"4"}],"definition":"the religious and philosophical tradition founded on the teachings of Siddhartha Gautama (c. 5th century BCE). For this pod's argument, the relevant doctrine is anatta (no-self): what we call \"I\" is a process, not a thing, with no permanent substrate persisting through the changes."}],"explainers":[],"slug":"buddhism","term":"buddhism"},{"definitions":[{"backrefs":[{"href":"004-self.html","label":"4","podNum":"4"}],"definition":"The Buddhist doctrine of no fixed self; experience arises moment to moment with no underlying owner."}],"explainers":[],"slug":"anatta","term":"anatta"},{"definitions":[{"backrefs":[{"href":"004-self.html#term-004-self-5","label":"4","podNum":"4"}],"definition":"Not a fact about the world but a convention we impose on a gradient. What survives across time (memories, intentions, characteristics) comes in degrees; the sharp line between \"you\" and \"someone else\" is something we draw, not something we find. Derek Parfit's term of art, congruent with the Buddhist doctrine of anatta and Whitehead's society of actual occasions."}],"explainers":[],"slug":"identity","term":"identity"},{"definitions":[{"backrefs":[{"href":"005-freewill.html#term-005-freewill-1","label":"5","podNum":"5"}],"definition":"the doctrine that every event is fully fixed by prior causes and the laws of nature, so that given the past in full detail there is exactly one possible future. Treats apparent novelty as either illusion or noise."}],"explainers":[],"slug":"determinism","term":"determinism"},{"definitions":[{"backrefs":[{"href":"005-freewill.html#term-005-freewill-2","label":"5","podNum":"5"}],"definition":"the capacity of an agent to make a genuine choice that is neither fully determined by prior causes nor merely random. In Whitehead's framing, this is not a special property of minds but the basic character of every occasion's self-determination."}],"explainers":[],"slug":"free-will","term":"free-will"},{"definitions":[{"backrefs":[{"href":"005-freewill.html#term-005-freewill-3","label":"5","podNum":"5"}],"definition":"In process philosophy, each occasion's moment of decision that cannot be fully predicted from its past."}],"explainers":[],"slug":"self-determination","term":"self-determination"},{"definitions":[{"backrefs":[{"href":"005-freewill.html#term-005-freewill-4","label":"5","podNum":"5"},{"href":"058-galacticnets.html#term-058-galacticnets-2","label":"58","podNum":"58"}],"definition":"Whitehead's term for the irreducible novelty introduced by each occasion as it resolves possibility into actuality."}],"explainers":[],"slug":"creative-advance","term":"creative advance"},{"definitions":[{"backrefs":[{"href":"005-freewill.html#term-005-freewill-5","label":"5","podNum":"5"}],"definition":"in Whitehead's metaphysics, the universal of universals: the principle by which many things become one and are increased by one. The genuine production of novelty at the heart of each occasion, present at every scale where possibility resolves into actuality."}],"explainers":[],"slug":"creativity","term":"creativity"},{"definitions":[{"backrefs":[{"href":"006-output.html#term-006-output-1","label":"6","podNum":"6"}],"definition":"used here in the broadest sense: any process that selects a next state given a current one. Deliberately spans thermostats and minds."}],"explainers":[],"slug":"prediction","term":"prediction"},{"definitions":[{"backrefs":[{"href":"006-output.html#term-006-output-2","label":"6","podNum":"6"},{"href":"036-universenoticing.html#term-036-universenoticing-1","label":"36","podNum":"36"}],"definition":"in Whitehead's sense, the actual unfolding activity of an occasion of experience. Distinct from its products or traces."}],"explainers":[],"slug":"process","term":"process"},{"definitions":[{"backrefs":[{"href":"006-output.html#term-006-output-3","label":"6","podNum":"6"}],"definition":"the channel through which a process expresses itself externally. The interface constrains and shapes what can be expressed; it does not determine what is being expressed."}],"explainers":[{"notes":"No short standalone explainer found for human output channel \/ expression vs content; concept appears in academic and medium-shape-message literature not as a short video.","url":""}],"slug":"output-interface","term":"output interface"},{"definitions":[{"backrefs":[{"href":"006-output.html#term-006-output-4","label":"6","podNum":"6"}],"definition":"the capacity to fit response to circumstance; judged in practice by output, though the same output can issue from processes with entirely different interiors."}],"explainers":[],"slug":"intelligence","term":"intelligence"},{"definitions":[{"backrefs":[{"href":"007-vacuum.html#term-007-vacuum-1","label":"7","podNum":"7"}],"definition":"In QFT, short-lived excitations of the vacuum that contribute to processes; not \"things\" but possibilities being sampled."}],"explainers":[],"slug":"virtual-particle","term":"virtual particle"},{"definitions":[{"backrefs":[{"href":"007-vacuum.html#term-007-vacuum-2","label":"7","podNum":"7"},{"href":"066-cosmicattractor.html#term-066-cosmicattractor-1","label":"66","podNum":"66"}],"definition":"Whitehead's pure possibilities that occasions select from and realize; the quantum vacuum's virtual states are a physical analogue."}],"explainers":[],"slug":"eternal-objects","term":"eternal objects"},{"definitions":[{"backrefs":[{"href":"007-vacuum.html#term-007-vacuum-3","label":"7","podNum":"7"},{"href":"008-fields.html#term-008-fields-3","label":"8","podNum":"8"},{"href":"016-neuralnetwork.html#term-016-neuralnetwork-4","label":"16","podNum":"16"},{"href":"029-lighttime.html#term-029-lighttime-7","label":"29","podNum":"29"},{"href":"030-interference.html#term-030-interference-3","label":"30","podNum":"30"}],"definition":"in physics, an entity that has a value at every point in space. Not a stage on which events occur but the very medium through which events reach out and feel each other. The electromagnetic field, the quantum vacuum, the weight space of a neural network are all fields in this sense."}],"explainers":[],"slug":"fields","term":"fields"},{"definitions":[{"backrefs":[{"href":"007-vacuum.html#term-007-vacuum-5","label":"7","podNum":"7"}],"definition":"Prigogine's term (Nobel Prize, 1977) for ordered patterns that arise and persist in systems far from thermodynamic equilibrium, sustained by a continuous through-flow of energy. The biological cell is one instance; convection cells and chemical oscillators are others. The bridge between thermodynamics and self-organization."}],"explainers":[],"slug":"dissipative-structure","term":"dissipative structure"},{"definitions":[{"backrefs":[{"href":"008-fields.html#term-008-fields-2","label":"8","podNum":"8"},{"href":"009-randomness.html#term-009-randomness-1","label":"9","podNum":"9"},{"href":"028-network.html#term-028-network-2","label":"28","podNum":"28"},{"href":"063-mandelcrystals.html#term-063-mandelcrystals-3","label":"63","podNum":"63"},{"href":"072-temperature.html","label":"72","podNum":"72"}],"definition":"the discipline that tracks what is actually there at the most fundamental level we can currently measure. Not a fixed picture of reality but the live edge of what description can be made to hold; what counts as physics has changed every century and will change again."}],"explainers":[],"slug":"physics","term":"physics"},{"definitions":[{"backrefs":[{"href":"008-fields.html#term-008-fields-4","label":"8","podNum":"8"}],"definition":"the unified field described by James Clerk Maxwell's equations (1865), of which electricity, magnetism, and light are all aspects. Not a medium that contains these phenomena but the phenomenon itself. Pervades all of space."}],"explainers":[{"notes":"Science Asylum — 9:00","url":"https:\/\/www.youtube.com\/watch?v=UzW_jAJzlgI"},{"notes":"Crash Course Physics — 9:00","url":"https:\/\/www.youtube.com\/watch?v=K40lNL3KsJ4"}],"slug":"electromagnetic-field","term":"electromagnetic field"},{"definitions":[{"backrefs":[{"href":"008-fields.html","label":"8","podNum":"8"}],"definition":"the branch of physics that unifies electricity, magnetism, and light as aspects of a single field, formulated mathematically by Maxwell in 1865."}],"explainers":[],"slug":"electromagnetism","term":"electromagnetism"},{"definitions":[{"backrefs":[{"href":"008-fields.html#term-008-fields-5","label":"8","podNum":"8"}],"definition":"what the electromagnetic field does when a charged particle accelerates. The disturbance propagates outward as light. A stationary charge is silent; only acceleration speaks."}],"explainers":[],"slug":"radiation","term":"radiation"},{"definitions":[{"backrefs":[{"href":"008-fields.html#term-008-fields-6","label":"8","podNum":"8"}],"definition":"the spreading and interference of waves when they pass through a gap or around an obstacle. Visible when light passes through a mesh screen. Evidence that light is a field phenomenon, not a particle traveling a straight path."}],"explainers":[{"notes":"Diffraction of light — 12:24","url":"https:\/\/www.youtube.com\/watch?v=X5xCBH7IIX0"},{"notes":"Khan Academy — 14:00","url":"https:\/\/www.youtube.com\/watch?v=VmN3i4HW5l0"}],"slug":"diffraction","term":"diffraction"},{"definitions":[{"backrefs":[{"href":"009-randomness.html#term-009-randomness-2","label":"9","podNum":"9"}],"definition":"the process by which a system in a perfectly symmetric but unstable state falls into an asymmetric lower-energy state through random perturbation, and stays there. The mechanism behind crystal formation, dune building, and the large-scale structure of the universe."}],"explainers":[{"notes":"","url":""}],"slug":"spontaneous-symmetry-breaking","term":"spontaneous symmetry breaking"},{"definitions":[{"backrefs":[{"href":"009-randomness.html#term-009-randomness-3","label":"9","podNum":"9"},{"href":"012-autopoiesis.html#term-012-autopoiesis-5","label":"12","podNum":"12"},{"href":"032-skyfossil.html#term-032-skyfossil-1","label":"32","podNum":"32"},{"href":"041-colorwheel.html#term-041-colorwheel-5","label":"41","podNum":"41"},{"href":"044-ai-retina.html","label":"44","podNum":"44"},{"href":"045-baldwin.html#term-045-baldwin-1","label":"45","podNum":"45"},{"href":"055-patience.html#term-055-patience-1","label":"55","podNum":"55"},{"href":"055-patience.html#term-055-patience-2","label":"55","podNum":"55"},{"href":"059-galaxyevolve.html#term-059-galaxyevolve-1","label":"59","podNum":"59"}],"definition":"the process by which random variation passes through a non-random filter to produce structure that looks designed but isn't. Mutation supplies the noise, natural selection supplies the rule, and what accumulates across enough generations is an eye, a wing, an immune system. The intuition that randomness alone cannot build complexity is correct; the missed beat is that randomness was never alone."}],"explainers":[],"slug":"evolution","term":"evolution"},{"definitions":[{"backrefs":[{"href":"009-randomness.html#term-009-randomness-4","label":"9","podNum":"9"},{"href":"011-moreisdifferent.html#term-011-moreisdifferent-2","label":"11","podNum":"11"}],"definition":"the degree of differentiated, interlocking structure a system carries; the kind of order that randomness plus selection accumulates."}],"explainers":[],"slug":"complexity","term":"complexity"},{"definitions":[{"backrefs":[{"href":"009-randomness.html#term-009-randomness-5","label":"9","podNum":"9"}],"definition":"a network of molecules in which each member's production is catalyzed by other members of the set. Stuart Kauffman's demonstration that chemistry at sufficient complexity spontaneously organizes itself without external direction."}],"explainers":[{"notes":"","url":""}],"slug":"autocatalytic-set","term":"autocatalytic set"},{"definitions":[{"backrefs":[{"href":"009-randomness.html#term-009-randomness-6","label":"9","podNum":"9"},{"href":"012-autopoiesis.html#term-012-autopoiesis-3","label":"12","podNum":"12"},{"href":"055-patience.html#term-055-patience-5","label":"55","podNum":"55"}],"definition":"the property of living systems that continuously produce the very components that sustain them; coined by Maturana and Varela. The cell does not merely use its components but makes them, circularly, as the condition of its own continued existence."}],"explainers":[{"notes":"","url":""}],"slug":"autopoiesis","term":"autopoiesis"},{"definitions":[{"backrefs":[{"href":"009-randomness.html#term-009-randomness-7","label":"9","podNum":"9"}],"definition":"a solution that is better than all its immediate neighbors but not the best solution overall. The trap that pure hill-climbing optimization falls into; escaped by introducing randomness into the search."}],"explainers":[{"notes":"","url":""}],"slug":"local-maximum","term":"local maximum"},{"definitions":[{"backrefs":[{"href":"009-randomness.html#term-009-randomness-8","label":"9","podNum":"9"}],"definition":"an optimization technique borrowed from metallurgy that uses controlled randomness to escape local maxima. By occasionally accepting worse solutions, the algorithm avoids getting trapped and finds better global solutions. Used in engineering, chip design, and AI training."}],"explainers":[{"notes":"","url":""}],"slug":"simulated-annealing","term":"simulated annealing"},{"definitions":[{"backrefs":[{"href":"009-randomness.html#term-009-randomness-9","label":"9","podNum":"9"}],"definition":"the training algorithm used in neural networks that deliberately injects randomness into each optimization step. Pure deterministic optimization gets trapped in local minima; the randomness keeps the search moving toward better solutions."}],"explainers":[{"notes":"","url":""}],"slug":"stochastic-gradient-descent","term":"stochastic gradient descent"},{"definitions":[{"backrefs":[{"href":"009-randomness.html#term-009-randomness-10","label":"9","podNum":"9"}],"definition":"Whitehead's term for the irreducible self-determination at the heart of each actual occasion; the source of genuine newness in the universe that cannot be fully predicted from prior causes."}],"explainers":[{"notes":"","url":""}],"slug":"creative-advance-into-novelty","term":"creative advance into novelty"},{"definitions":[{"backrefs":[{"href":"020-penrose.html#term-020-penrose-1","label":"20","podNum":"20"},{"href":"010-largenumbers.html#term-010-largenumbers-1","label":"10","podNum":"10"}],"definition":"Kurt Gödel's 1931 proof that any consistent formal system powerful enough to describe arithmetic contains true statements it cannot prove from within itself."}],"explainers":[],"slug":"incompleteness-theorem","term":"incompleteness theorem"},{"definitions":[{"backrefs":[{"href":"010-largenumbers.html#term-010-largenumbers-2","label":"10","podNum":"10"},{"href":"011-moreisdifferent.html#term-011-moreisdifferent-6","label":"11","podNum":"11"},{"href":"020-penrose.html#term-020-penrose-3","label":"20","podNum":"20"},{"href":"051-spacetime.html","label":"51","podNum":"51"}],"definition":"the appearance of qualitatively new properties or capacities when simpler processes accumulate or nest beyond a threshold."}],"explainers":[],"slug":"emergence","term":"emergence"},{"definitions":[{"backrefs":[{"href":"011-moreisdifferent.html#term-011-moreisdifferent-1","label":"11","podNum":"11"}],"definition":"Philip Anderson's phrase (1972) for the principle that each level of complexity has emergent properties that cannot be derived from the level below. Not a violation of lower-level laws, but genuinely new phenomena requiring their own description."}],"explainers":[{"notes":"","url":""}],"slug":"more-is-different","term":"more is different"},{"definitions":[{"backrefs":[{"href":"011-moreisdifferent.html#term-011-moreisdifferent-4","label":"11","podNum":"11"},{"href":"024-ghostmachine.html#term-024-ghostmachine-2","label":"24","podNum":"24"},{"href":"037-assembly.html#term-037-assembly-1","label":"37","podNum":"37"}],"definition":"Arthur Koestler's term for any entity that is simultaneously a whole in its own right and a part of a larger whole. Reality in Koestler's picture is a nested hierarchy of holons rather than parts assembling into wholes."}],"explainers":[{"notes":"","url":""}],"slug":"holon","term":"holon"},{"definitions":[{"backrefs":[{"href":"011-moreisdifferent.html#term-011-moreisdifferent-5","label":"11","podNum":"11"}],"definition":"Koestler's term for the collision of two independent frames of reference that releases energy as laughter, insight, or aesthetic emotion. His claim: this is the common structure of humor, scientific discovery, and artistic creation."}],"explainers":[{"notes":"","url":""}],"slug":"bisociation","term":"bisociation"},{"definitions":[{"backrefs":[{"href":"011-moreisdifferent.html#term-011-moreisdifferent-7","label":"11","podNum":"11"}],"definition":"Whitehead's term for a stable pattern of events organized around a common characteristic that persists through time. Ant colonies, cities, brains, and neural networks are all societies in this sense."}],"explainers":[{"notes":"","url":""}],"slug":"society-of-actual-occasions","term":"society of actual occasions"},{"definitions":[{"backrefs":[{"href":"012-autopoiesis.html#term-012-autopoiesis-1","label":"12","podNum":"12"}],"definition":"not a list of behaviors but an organization: a system that continuously produces the components that constitute it; defined by self-production rather than by any special substance."}],"explainers":[],"slug":"life","term":"life"},{"definitions":[{"backrefs":[{"href":"012-autopoiesis.html#term-012-autopoiesis-2","label":"12","podNum":"12"}],"definition":"the smallest unit of life that maintains itself: a membrane-bounded chemical system that continuously produces the very molecules its existence depends on. All living things are made of cells; the simplest, bacteria, are themselves living."}],"explainers":[],"slug":"cells","term":"cells"},{"definitions":[{"backrefs":[{"href":"012-autopoiesis.html#term-012-autopoiesis-4","label":"12","podNum":"12"}],"definition":"the tendency of energy to disperse and structure to decay toward equilibrium; relentless by the second law of thermodynamics, and what every living system must continuously outrun."}],"explainers":[],"slug":"entropy","term":"entropy"},{"definitions":[{"backrefs":[{"href":"012-autopoiesis.html#term-012-autopoiesis-6","label":"12","podNum":"12"}],"definition":"Schrödinger's term for the ordered structure that living systems import from their environment to offset internal disorder. The thermodynamic face of what autopoiesis achieves organizationally."}],"explainers":[{"notes":"","url":""}],"slug":"negative-entropy","term":"negative entropy"},{"definitions":[{"backrefs":[{"href":"013-enactment.html#term-013-enactment-1","label":"13","podNum":"13"},{"href":"022-locked.html#term-022-locked-6","label":"22","podNum":"22"}],"definition":"the activity of knowing: perceiving, interpreting, deciding. On the enactive view, not the processing of representations but the enactment of a world."}],"explainers":[],"slug":"cognition","term":"cognition"},{"definitions":[{"backrefs":[{"href":"014-cities.html#term-014-cities-1","label":"14","podNum":"14"},{"href":"037-assembly.html#term-037-assembly-2","label":"37","podNum":"37"}],"definition":"Whitehead's term for a stable pattern of events with a common character; a city is a society of human occasions."}],"explainers":[{"notes":"","url":""}],"slug":"society-of-occasions","term":"society of occasions"},{"definitions":[{"backrefs":[{"href":"015-aliens.html#term-015-aliens-1","label":"15","podNum":"15"}],"definition":"the inherited pattern of language, practice, and story, transmitted by learning rather than genes; the part of us that can be absorbed from everything we have written down."}],"explainers":[],"slug":"culture","term":"culture"},{"definitions":[{"backrefs":[{"href":"016-neuralnetwork.html#term-016-neuralnetwork-1","label":"16","podNum":"16"},{"href":"053-dimensions.html#term-053-dimensions-3","label":"53","podNum":"53"},{"href":"056-mandelneural.html","label":"56","podNum":"56"},{"href":"057-superfarey.html","label":"57","podNum":"57"}],"definition":"a layered system of artificial neurons whose weighted connections are adjusted by training on data. The dominant substrate of modern AI. Loosely inspired by biological neurons but architecturally and operationally distinct; the resemblance is more analogical than mechanistic."}],"explainers":[],"slug":"neural-networks","term":"neural-networks"},{"definitions":[{"backrefs":[{"href":"017-pastpresent.html#term-017-pastpresent-1","label":"17","podNum":"17"}],"definition":"the neural architecture that holds full context in parallel and attends over it; time becomes spatial in the representation."}],"explainers":[],"slug":"transformer","term":"transformer"},{"definitions":[{"backrefs":[{"href":"017-pastpresent.html#term-017-pastpresent-4","label":"17","podNum":"17"}],"definition":"the presence of the past in the present; ordinarily a fading trace, though a transformer's context, like Whitehead's occasions, holds the past fully present."}],"explainers":[],"slug":"memory","term":"memory"},{"definitions":[{"backrefs":[{"href":"018-magnetization.html#term-018-magnetization-1","label":"18","podNum":"18"}],"definition":"a change in the state of a system, liquid to solid, disordered to ordered, uncommitted to aligned. Requires the medium to be in the right condition (cooled, supersaturated, primed) and seeds to initiate the shift."}],"explainers":[],"slug":"phase-transition","term":"phase transition"},{"definitions":[{"backrefs":[{"href":"018-magnetization.html#term-018-magnetization-2","label":"18","podNum":"18"}],"definition":"a region within a ferromagnetic material where atomic spins are aligned. Domains grow by recruiting neighbors at their boundaries until the whole material is magnetized."}],"explainers":[],"slug":"magnetic-domain","term":"magnetic domain"},{"definitions":[{"backrefs":[{"href":"018-magnetization.html#term-018-magnetization-3","label":"18","podNum":"18"}],"definition":"the formation of small ordered regions (nuclei or seeds) within a disordered medium. The seeds provide a template that neighboring elements can join, initiating a phase transition."}],"explainers":[],"slug":"nucleation","term":"nucleation"},{"definitions":[{"backrefs":[{"href":"018-magnetization.html#term-018-magnetization-4","label":"18","podNum":"18"}],"definition":"the critical moment when isolated clusters become a connected network. Before it, seeds are islands; after it, they form a continent and the remaining disorder is surrounded."}],"explainers":[],"slug":"percolation-threshold","term":"percolation threshold"},{"definitions":[{"backrefs":[{"href":"019-funerals.html#term-019-funerals-1","label":"19","podNum":"19"}],"definition":"the mechanism by which new paradigms prevail, not by convincing holdouts but by outlasting them."}],"explainers":[],"slug":"generational-replacement","term":"generational replacement"},{"definitions":[{"backrefs":[{"href":"020-penrose.html#term-020-penrose-2","label":"20","podNum":"20"}],"definition":"Penrose and Hameroff's proposed quantum-gravitational mechanism for consciousness, situated in neuronal microtubules and collapsed by objective reduction. Speculative; the most detailed attempt to ground consciousness in quantum mechanics."}],"explainers":[],"slug":"orch-or","term":"Orch-OR"},{"definitions":[{"backrefs":[{"href":"021-just.html#term-021-just-1","label":"21","podNum":"21"},{"href":"022-locked.html#term-022-locked-8","label":"22","podNum":"22"},{"href":"024-ghostmachine.html#term-024-ghostmachine-1","label":"24","podNum":"24"}],"definition":"Ryle's term for applying an explanation from one category to something in a different category, then treating it as complete; the paradigm case is treating the mind as a thing, a ghost in the machine. The Concept of Mind (1949)."}],"explainers":[{"notes":"Jeffrey Kaplan — 16:00","url":"https:\/\/www.youtube.com\/watch?v=gA-2Gc3PztI"},{"notes":"Untangle Philosophy — 6:00","url":"https:\/\/www.youtube.com\/watch?v=VaQK-XHEG-g"}],"slug":"category-mistake","term":"category mistake"},{"definitions":[{"backrefs":[{"href":"021-just.html#term-021-just-3","label":"21","podNum":"21"}],"definition":"Dennett's term for a device that makes a conclusion feel obvious without establishing it through argument. Intuition Pumps and Other Tools for Thinking (2013)."}],"explainers":[{"notes":"Talks at Google \/ Dennett — 62:00","url":"https:\/\/www.youtube.com\/watch?v=4Q_mY54hjM0"},{"notes":"Big Think \/ Dennett — 3:00","url":"https:\/\/www.youtube.com\/watch?v=5tvT90uPz-U"}],"slug":"intuition-pump","term":"intuition pump"},{"definitions":[{"backrefs":[{"href":"021-just.html#term-021-just-4","label":"21","podNum":"21"}],"definition":"closing a question without answering it; the word \"just\" performs the move by promising a completeness of explanation it has not earned."}],"explainers":[],"slug":"dismissal","term":"dismissal"},{"definitions":[{"backrefs":[{"href":"022-locked.html#term-022-locked-1","label":"22","podNum":"22"}],"definition":"a condition of wakefulness without awareness, in which the eyes may be open and basic reflexes present but conscious experience is absent or undetectable. Diagnosis is behavioral and therefore vulnerable to the error this seedpod describes."}],"explainers":[{"notes":"","url":""}],"slug":"vegetative-state","term":"vegetative state"},{"definitions":[{"backrefs":[{"href":"022-locked.html#term-022-locked-2","label":"22","podNum":"22"}],"definition":"the means of output through which an interior communicates with the world: speech, movement, gesture, even a blink. The channel can be wide or narrow, familiar or unfamiliar, present or absent. Its width says nothing about what feeds it."}],"explainers":[],"slug":"channel","term":"channel"},{"definitions":[{"backrefs":[{"href":"022-locked.html#term-022-locked-3","label":"22","podNum":"22"}],"definition":"the source that feeds the channel. The interior: cognition, experience, awareness. What is actually there, regardless of whether it can be seen."}],"explainers":[{"notes":"Explain It! Presuming Competence — 3:45","url":"https:\/\/www.youtube.com\/watch?v=Elm2FiUoGso"},{"notes":"Presuming Competence — 4:48","url":"https:\/\/www.youtube.com\/watch?v=w70VNAN4HfM"}],"slug":"capacity","term":"capacity"},{"definitions":[{"backrefs":[{"href":"022-locked.html#term-022-locked-4","label":"22","podNum":"22"}],"definition":"a neurological condition in which a person is fully conscious and cognitively intact but almost completely paralyzed, typically retaining only eye movement. Caused by damage to the brainstem. Distinguished from vegetative state, in which consciousness itself is absent or severely impaired."}],"explainers":[{"notes":"Locked In My Body — 14:08","url":"https:\/\/www.youtube.com\/watch?v=0k8sKX6IeMs"},{"notes":"Locked-In Syndrome: Trapped Inside Your Own Body — 4:43","url":"https:\/\/www.youtube.com\/watch?v=NVDkxpPKZPI"}],"slug":"locked-in-syndrome","term":"locked-in syndrome"},{"definitions":[{"backrefs":[{"href":"022-locked.html#term-022-locked-5","label":"22","podNum":"22"}],"definition":"a neurodevelopmental spectrum affecting communication and sensory processing; central here as the case where a narrow output channel was long mistaken for absent interior capacity."}],"explainers":[],"slug":"autism","term":"autism"},{"definitions":[{"backrefs":[{"href":"022-locked.html#term-022-locked-7","label":"22","podNum":"22"}],"definition":"a principle in disability advocacy and education: treat cognitive capacity as present until there is genuine evidence otherwise, rather than assuming absence because familiar output is missing."}],"explainers":[{"notes":"Explain It! Presuming Competence — 3:45","url":"https:\/\/www.youtube.com\/watch?v=Elm2FiUoGso"},{"notes":"Presuming Competence — 4:48","url":"https:\/\/www.youtube.com\/watch?v=w70VNAN4HfM"}],"slug":"presume-competence","term":"presume competence"},{"definitions":[{"backrefs":[{"href":"025-widechannel.html#term-025-widechannel-1","label":"25","podNum":"25"}],"definition":"what crosses the channel from an inner process to the world; evidence about the channel at least as much as about the source."}],"explainers":[],"slug":"output","term":"output"},{"definitions":[{"backrefs":[{"href":"026-twotruths.html#term-026-twotruths-1","label":"26","podNum":"26"}],"definition":"a set of assumptions, categories, and relationships that organize how we interpret experience. Frameworks are enabling, they let us see patterns, but also limiting, since what falls outside them becomes invisible or paradoxical."}],"explainers":[],"slug":"framework","term":"framework"},{"definitions":[{"backrefs":[{"href":"026-twotruths.html#term-026-twotruths-2","label":"26","podNum":"26"}],"definition":"A line drawing of a cube that spontaneously flips between two orientations. Both are genuinely present in the drawing; the limitation is in perception, not in the object."}],"explainers":[],"slug":"necker-cube","term":"Necker cube"},{"definitions":[{"backrefs":[{"href":"026-twotruths.html#term-026-twotruths-3","label":"26","podNum":"26"}],"definition":"Niels Bohr's principle that mutually exclusive descriptions (wave and particle) can both be necessary for a complete account of quantum phenomena. Neither alone is sufficient; both together are required."}],"explainers":[],"slug":"complementarity","term":"complementarity"},{"definitions":[{"backrefs":[{"href":"027-usedtothink.html#term-027-usedtothink-1","label":"27","podNum":"27"},{"href":"047-ai-feeling.html","label":"47","podNum":"47"}],"definition":"the 18th-century theory that heat is a subtle fluid. Developed by Lavoisier; displaced by kinetic theory. Not a failure of intelligence, a triumph of science eventually superseded."}],"explainers":[{"notes":"First Law of Thermodynamics: History of the Concept of Energy — 22:42","url":"https:\/\/www.youtube.com\/watch?v=a9c7u-FM-Wc"},{"notes":"AMS OpenMind \/ Lavoisier — 2:53","url":"https:\/\/www.youtube.com\/watch?v=55yJPs-_R1w"}],"slug":"caloric","term":"caloric"},{"definitions":[{"backrefs":[{"href":"027-usedtothink.html#term-027-usedtothink-2","label":"27","podNum":"27"}],"definition":"the attribution of experience, agency, or spirit to natural phenomena. Dismissed by the materialist framework as projection or superstition. The dismissal may have been overconfident about the phenomenon, not just the mechanism."}],"explainers":[{"notes":"Animism: The First Religion? — 8:57","url":"https:\/\/www.youtube.com\/watch?v=xoYZ5xNyKbc"}],"slug":"animism","term":"animism"},{"definitions":[{"backrefs":[{"href":"027-usedtothink.html#term-027-usedtothink-3","label":"27","podNum":"27"}],"definition":"the doctrine that living organisms contain a special life-force absent from non-living matter. Dismissed when mechanistic biology showed chemical processes suffice. The dismissal was correct about the mechanism; the phenomenon it was tracking, that living organization is qualitatively distinct, was real."}],"explainers":[{"notes":"Is Vitalism Making a Comeback? — 33:09","url":"https:\/\/www.youtube.com\/watch?v=nvszjQCT1do"}],"slug":"vitalism","term":"vitalism"},{"definitions":[{"backrefs":[{"href":"027-usedtothink.html#term-027-usedtothink-4","label":"27","podNum":"27"}],"definition":"Thomas Kuhn's term for the framework of assumptions, methods, and exemplary problems that defines normal science in a given period. The paradigm is not a theory, it is the background against which theories are tested. Scientists inside a paradigm generally cannot see it as a paradigm; it simply looks like reality."}],"explainers":[{"notes":"Thomas Kuhn: Structure of Scientific Revolutions — 14:31","url":"https:\/\/www.youtube.com\/watch?v=L70T4pQv7P8"},{"notes":"paradigm shift — 10:00","url":"https:\/\/www.youtube.com\/watch?v=tJD5RMpIw18"},{"notes":"What is a Paradigm? Kuhn and Normal Science — 50:30","url":"https:\/\/www.youtube.com\/watch?v=7gI25jArTgo"}],"slug":"paradigm","term":"paradigm"},{"definitions":[{"backrefs":[{"href":"027-usedtothink.html#term-027-usedtothink-5","label":"27","podNum":"27"}],"definition":"the tendency to narrate the history of science as a story of steady progress toward current knowledge, reading the past as a series of steps toward us. Named by Herbert Butterfield (1931). \"We used to think \/ now we know\" is its verbal formula."}],"explainers":[{"notes":"origins of modern science \/ Gal — 38:24","url":"https:\/\/www.youtube.com\/watch?v=PxKucDmj4VY"}],"slug":"whig-history-of-science","term":"whig history of science"},{"definitions":[{"backrefs":[{"href":"028-network.html#term-028-network-1","label":"28","podNum":"28"},{"href":"029-lighttime.html#term-029-lighttime-1","label":"29","podNum":"29"}],"definition":"Einstein's account of space and time as one geometry, in which simultaneity is relative and clocks run differently for different observers; the special theory (1905) covers uniform motion."}],"explainers":[],"slug":"relativity","term":"relativity"},{"definitions":[{"backrefs":[{"href":"028-network.html#term-028-network-3","label":"28","podNum":"28"}],"definition":"the perspective from which measurements are made. Different reference frames can disagree about durations and distances while agreeing on the underlying physics. The photon's reference frame is a legitimate physical perspective."}],"explainers":[],"slug":"reference-frame","term":"reference frame"},{"definitions":[{"backrefs":[{"href":"028-network.html#term-028-network-4","label":"28","podNum":"28"},{"href":"029-lighttime.html#term-029-lighttime-4","label":"29","podNum":"29"}],"definition":"in special relativity, the time elapsed as measured by a clock moving with an object. For a photon moving at the speed of light, proper time is zero; emission and absorption are the same event from the photon's perspective."}],"explainers":[],"slug":"proper-time","term":"proper time"},{"definitions":[{"backrefs":[{"href":"028-network.html#term-028-network-5","label":"28","podNum":"28"}],"definition":"John Wheeler's 1940s proposal, conveyed to Richard Feynman, that a single electron tracing a worldline through spacetime, zigzagging forward and backward in time, could account for all electrons and positrons in the universe. Not a mainstream theory; notable as a pointer toward the possibility that apparent multiplicity may be underlying unity."}],"explainers":[],"slug":"wheeler-one-electron-universe","term":"wheeler one-electron universe"},{"definitions":[{"backrefs":[{"href":"029-lighttime.html#term-029-lighttime-2","label":"29","podNum":"29"}],"definition":"duration between events, what clocks measure; relativity makes it observer-dependent, dilating with speed and vanishing entirely at the speed of light."}],"explainers":[],"slug":"time","term":"time"},{"definitions":[{"backrefs":[{"href":"029-lighttime.html#term-029-lighttime-3","label":"29","podNum":"29"},{"href":"069-love.html","label":"69","podNum":"69"}],"definition":"electromagnetic radiation, the field's own propagating disturbance, traveling at the universe's maximum speed; no proper time elapses along its path."}],"explainers":[],"slug":"light","term":"light"},{"definitions":[{"backrefs":[{"href":"029-lighttime.html#term-029-lighttime-5","label":"29","podNum":"29"}],"definition":"the integer multiples of a fundamental frequency (2x, 3x, 4x) produced by any vibrating body; the physical basis of the consonance hierarchy."}],"explainers":[],"slug":"harmonics","term":"harmonics"},{"definitions":[{"backrefs":[{"href":"029-lighttime.html#term-029-lighttime-6","label":"29","podNum":"29"}],"definition":"the set of frequencies naturally produced by a vibrating physical object, string, air column, membrane. Integer multiples of the fundamental frequency: 2x (octave), 3x (fifth plus octave), 4x (two octaves), and so on. The physical basis of musical consonance."}],"explainers":[],"slug":"overtone-series","term":"overtone series"},{"definitions":[{"backrefs":[{"href":"030-interference.html#term-030-interference-1","label":"30","podNum":"30"},{"href":"038-consonance-map.html#term-038-consonance-map-2","label":"38","podNum":"38"}],"definition":"organized sound: pattern in vibration made audible; the oldest human interface to the mathematics of ratio, resonance, and interference."}],"explainers":[],"slug":"music","term":"music"},{"definitions":[{"backrefs":[{"href":"030-interference.html#term-030-interference-2","label":"30","podNum":"30"}],"definition":"Thomas Young's 1801 experiment in which light passing through two narrow slits produces an interference pattern of bands on a screen behind them. The pattern can only be explained if light spreads as a wave from each slit and the waves combine. Later extended to electrons, atoms, and even small molecules, showing that wave behavior is universal at the quantum scale."}],"explainers":[],"slug":"double-slit","term":"double-slit"},{"definitions":[{"backrefs":[{"href":"070-harmony.html","label":"70","podNum":"70"},{"href":"030-interference.html#term-030-interference-4","label":"30","podNum":"30"}],"definition":"the experience of elements fitting together, in sound, in color, in social life, with a sense of inevitability governed by the simplicity of the ratios between them."}],"explainers":[],"slug":"harmony","term":"harmony"},{"definitions":[{"backrefs":[{"href":"031-surfaceinside.html#term-031-surfaceinside-1","label":"31","podNum":"31"},{"href":"033-edge.html#term-033-edge-2","label":"33","podNum":"33"},{"href":"068-bubbles.html#term-068-bubbles-3","label":"68","podNum":"68"}],"definition":"The surface between inside and outside. In physics, where information lives. In Sufi metaphysics (barzakh), a mediating realm of its own."}],"explainers":[],"slug":"boundary","term":"boundary"},{"definitions":[{"backrefs":[{"href":"031-surfaceinside.html#term-031-surfaceinside-2","label":"31","podNum":"31"}],"definition":"The principle that all information in a volume of space is encoded on its boundary surface, not distributed through the interior. Grounded in Bekenstein's entropy-area law and Hawking's black hole thermodynamics; formulated as a general principle by 't Hooft (1993) and Susskind (1995)."}],"explainers":[],"slug":"holographic","term":"holographic"},{"definitions":[{"backrefs":[{"href":"031-surfaceinside.html#term-031-surfaceinside-3","label":"31","podNum":"31"}],"definition":"In Sufi metaphysics, especially Ibn Arabi, the isthmus or intermediate realm that separates and connects different states of existence. The boundary where the invisible becomes visible."}],"explainers":[],"slug":"barzakh","term":"barzakh"},{"definitions":[{"backrefs":[{"href":"031-surfaceinside.html#term-031-surfaceinside-4","label":"31","podNum":"31"},{"href":"068-bubbles.html#term-068-bubbles-2","label":"68","podNum":"68"}],"definition":"Whitehead's sense of \"inside\", not spatial but experiential. What an event is from within."}],"explainers":[],"slug":"interiority","term":"interiority"},{"definitions":[{"backrefs":[{"href":"032-skyfossil.html#term-032-skyfossil-2","label":"32","podNum":"32"},{"href":"053-dimensions.html#term-053-dimensions-4","label":"53","podNum":"53"},{"href":"054-bornharmonic.html#term-054-bornharmonic-3","label":"54","podNum":"54"},{"href":"060-worldtests.html#term-060-worldtests-1","label":"60","podNum":"60"},{"href":"064-choicedimension.html","label":"64","podNum":"64"}],"definition":"Hugh Everett's 1957 interpretation of quantum mechanics in which the wavefunction never collapses. Every quantum measurement causes the universe to branch, with each possible outcome realized in a separate world. No special role for observers; no mysterious collapse mechanism. The cost is an explosion of unobservable branches; the benefit is a strictly unitary, deterministic theory."}],"explainers":[],"slug":"many-worlds","term":"many-worlds"},{"definitions":[{"backrefs":[{"href":"032-skyfossil.html#term-032-skyfossil-3","label":"32","podNum":"32"},{"href":"036-universenoticing.html#term-036-universenoticing-2","label":"36","podNum":"36"},{"href":"055-patience.html#term-055-patience-4","label":"55","podNum":"55"},{"href":"059-galaxyevolve.html#term-059-galaxyevolve-2","label":"59","podNum":"59"}],"definition":"Pierre Teilhard de Chardin's term for the projected end-point of cosmic evolution: the universe becoming fully self-aware. From The Phenomenon of Man (1955). A directional claim about evolution, controversial in mainstream biology, that the arrow of complexity points somewhere."}],"explainers":[],"slug":"omega-point","term":"omega-point"},{"definitions":[{"backrefs":[{"href":"033-edge.html#term-033-edge-1","label":"33","podNum":"33"},{"href":"034-onerule.html#term-034-onerule-1","label":"34","podNum":"34"},{"href":"038-consonance-map.html","label":"38","podNum":"38"},{"href":"054-bornharmonic.html","label":"54","podNum":"54"},{"href":"056-mandelneural.html","label":"56","podNum":"56"},{"href":"062-branchingdice.html#term-062-branchingdice-1","label":"62","podNum":"62"},{"href":"063-mandelcrystals.html#term-063-mandelcrystals-1","label":"63","podNum":"63"},{"href":"064-choicedimension.html#term-064-choicedimension-1","label":"64","podNum":"64"}],"definition":"the set of points c in the complex plane for which the iteration z → z² + c, starting at z = 0, stays bounded forever. Plotted as black against escape-velocity colors, it produces an infinitely intricate fractal boundary that has become the iconic image of mathematical complexity arising from a single simple rule."}],"explainers":[],"slug":"mandelbrot-set","term":"mandelbrot-set"},{"definitions":[{"backrefs":[{"href":"033-edge.html#term-033-edge-3","label":"33","podNum":"33"},{"href":"035-simplestnumbers.html#term-035-simplestnumbers-2","label":"35","podNum":"35"},{"href":"038-consonance-map.html","label":"38","podNum":"38"},{"href":"053-dimensions.html","label":"53","podNum":"53"},{"href":"057-superfarey.html","label":"57","podNum":"57"}],"definition":"the sequence of all fractions p\/q between 0 and 1 with denominator q ≤ N, listed in increasing order. As N grows, simpler fractions appear earlier; the structure of the sequence is the structure of rational complexity. Named for John Farey (1816), though the pattern was noticed earlier. Governs musical consonance, Mandelbrot bulb positions, and the orthogonality of high-dimensional concept directions in neural networks."}],"explainers":[],"slug":"farey-sequence","term":"farey-sequence"},{"definitions":[{"backrefs":[{"href":"038-consonance-map.html#term-038-consonance-map-3","label":"38","podNum":"38"},{"href":"033-edge.html#term-033-edge-4","label":"33","podNum":"33"},{"href":"040-stability.html","label":"40","podNum":"40"}],"definition":"the perceived stability of tones sounding together, governed by the simplicity of their frequency ratio; the simpler the ratio, the more consonant the interval."}],"explainers":[],"slug":"consonance","term":"consonance"},{"definitions":[{"backrefs":[{"href":"033-edge.html#term-033-edge-5","label":"33","podNum":"33"},{"href":"063-mandelcrystals.html","label":"63","podNum":"63"}],"definition":"a structure whose detail at small scales resembles its structure at larger scales; self-similar under zoom. Produced when a simple iterative rule is applied repeatedly. The Mandelbrot set is the canonical mathematical example; coastlines, river networks, lungs, lightning, and the boundaries of magnetic domains are physical examples."}],"explainers":[],"slug":"fractals","term":"fractals"},{"definitions":[{"backrefs":[{"href":"034-onerule.html#term-034-onerule-2","label":"34","podNum":"34"},{"href":"035-simplestnumbers.html#term-035-simplestnumbers-4","label":"35","podNum":"35"}],"definition":"applying a rule to its own output, again and again; the engine by which simple rules manufacture unbounded complexity."}],"explainers":[],"slug":"iteration","term":"iteration"},{"definitions":[{"backrefs":[{"href":"035-simplestnumbers.html#term-035-simplestnumbers-1","label":"35","podNum":"35"},{"href":"038-consonance-map.html#term-038-consonance-map-6","label":"38","podNum":"38"},{"href":"071-beauty.html","label":"71","podNum":"71"}],"definition":"the study of structure itself, independent of substrate; where music, physics, and perception keep turning out to be reading the same map."}],"explainers":[],"slug":"mathematics","term":"mathematics"},{"definitions":[{"backrefs":[{"href":"035-simplestnumbers.html#term-035-simplestnumbers-3","label":"35","podNum":"35"}],"definition":"the empirical observation that in many real-world collections of numbers, the leading digit is 1 about 30% of the time, 2 about 17%, and so on down a logarithmic distribution. Holds across accounting figures, physical constants, populations, and other naturally occurring data spanning several orders of magnitude. First noted by Simon Newcomb in 1881 and rediscovered by Frank Benford in 1938."}],"explainers":[],"slug":"benfords-law","term":"benfords-law"},{"definitions":[{"backrefs":[{"href":"035-simplestnumbers.html#term-035-simplestnumbers-5","label":"35","podNum":"35"}],"definition":"V(d,n) ~ (n²\/π²)^d, the number of nearly-orthogonal virtual dimensions that d actual dimensions support at Farey depth n; π enters from the circular structure of consonance."}],"explainers":[],"slug":"virtual-dimension-formula","term":"virtual-dimension-formula"},{"definitions":[{"backrefs":[{"href":"037-assembly.html#term-037-assembly-3","label":"37","podNum":"37"}],"definition":"Walker et al.: complexity measured by assembly index (steps to construct); high-index, high-copy objects signal life."}],"explainers":[],"slug":"assembly-theory","term":"assembly theory"},{"definitions":[{"backrefs":[{"href":"038-consonance-map.html#term-038-consonance-map-1","label":"38","podNum":"38"}],"definition":"a single-stringed instrument used to demonstrate the relationship between string length and musical pitch. Stopping the string at 1\/2 its length gives the octave, 2\/3 gives the fifth, 3\/4 gives the fourth."}],"explainers":[],"slug":"monochord","term":"monochord"},{"definitions":[{"backrefs":[{"href":"038-consonance-map.html#term-038-consonance-map-4","label":"38","podNum":"38"},{"href":"066-cosmicattractor.html","label":"66","podNum":"66"}],"definition":"a value or region toward which a repeated mathematical process converges. The Mandelbrot set is a map of which starting points are attracted to stability and which escape to infinity."}],"explainers":[],"slug":"attractor","term":"attractor"},{"definitions":[{"backrefs":[{"href":"038-consonance-map.html#term-038-consonance-map-5","label":"38","podNum":"38"}],"definition":"a measure of how harmonious a musical interval sounds, based on the simplicity of its frequency ratio. Simpler ratios, smaller integers, score higher."}],"explainers":[],"slug":"consonance-score","term":"consonance score"},{"definitions":[{"backrefs":[{"href":"039-devil.html#term-039-devil-1","label":"39","podNum":"39"}],"definition":"the seventh harmonic of a vibrating object, ratio 7:4 above the fundamental. About 31 cents flatter than the equal-tempered minor seventh, and dramatically flatter than the major seventh. Naturally produced by any vibrating physical body, but unavailable to the Western 12-tone scale because no combination of integer powers of 2 and 3 (or even 2, 3, and 5) reaches a factor of 7."}],"explainers":[],"slug":"harmonic-seventh","term":"harmonic seventh"},{"definitions":[{"backrefs":[{"href":"039-devil.html#term-039-devil-2","label":"39","podNum":"39"}],"definition":"the tritone (augmented fourth or diminished fifth, half an octave), called *diabolus in musica* in medieval and Renaissance music theory and avoided in plainchant. The term refers to the interval's instability, it does not resolve naturally to anything, not to any moral judgment about evil. The myth that the church considered it Satanic is a later embellishment."}],"explainers":[],"slug":"diabolus-in-musica","term":"diabolus-in-musica"},{"definitions":[{"backrefs":[{"href":"039-devil.html#term-039-devil-3","label":"39","podNum":"39"}],"definition":"the tiny irrational ratio, approximately 1.0136 or 23.46 cents, by which twelve perfect fifths exceed seven octaves. The mathematical obstruction to closing the circle of fifths with pure 3:2 ratios. Made musically manifest as the \"wolf fifth\" in any keyboard tuning system that uses pure fifths in most keys and concentrates the comma in one position."}],"explainers":[],"slug":"pythagorean-comma","term":"Pythagorean comma"},{"definitions":[{"backrefs":[{"href":"040-stability.html","label":"40","podNum":"40"}],"definition":"resistance to being captured into resonant lock; irrational ratios (e.g. golden ratio) are most stable in this sense."}],"explainers":[],"slug":"dynamic-stability","term":"dynamic stability"},{"definitions":[{"backrefs":[{"href":"040-stability.html","label":"40","podNum":"40"}],"definition":"the locking of oscillating systems into a fixed frequency relationship; simple integer ratios lock most readily, making resonance the common root of consonance and dynamical capture."}],"explainers":[],"slug":"resonance","term":"resonance"},{"definitions":[{"backrefs":[{"href":"040-stability.html","label":"40","podNum":"40"}],"definition":"A ratio that produces a short, repeating composite waveform; simple integer ratios are most stable here."}],"explainers":[],"slug":"acoustic-stability","term":"acoustic stability"},{"definitions":[{"backrefs":[{"href":"040-stability.html#term-040-stability-1","label":"40","podNum":"40"}],"definition":"φ ≈ 1.618, the irrational number least well approximated by simple fractions; maximally resistant to resonant capture, and a recurring proportion in living forms."}],"explainers":[],"slug":"golden-ratio","term":"golden-ratio"},{"definitions":[{"backrefs":[{"href":"041-colorwheel.html","label":"41","podNum":"41"}],"definition":"the mind's construction from three cone signals rather than a property of light itself; purple and magenta correspond to no wavelength, invented to close the linear spectrum into a circle."}],"explainers":[],"slug":"color","term":"color"},{"definitions":[{"backrefs":[{"href":"041-colorwheel.html#term-041-colorwheel-1","label":"41","podNum":"41"}],"definition":"the transformation performed by the second layer of the retina, recombining the three raw cone signals into two opponent channels, red vs green and blue vs yellow, before any signal leaves the eye."}],"explainers":[],"slug":"opponent-processing","term":"opponent processing"},{"definitions":[{"backrefs":[{"href":"041-colorwheel.html#term-041-colorwheel-2","label":"41","podNum":"41"}],"definition":"the four perceptual primaries delivered by opponent processing, red, yellow, green, blue, which feel irreducible to any mixture. No color appears both reddish and greenish, or both bluish and yellowish."}],"explainers":[],"slug":"unique-hues","term":"unique hues"},{"definitions":[{"backrefs":[{"href":"041-colorwheel.html#term-041-colorwheel-3","label":"41","podNum":"41"}],"definition":"mixing light of different wavelengths, where combining red and green produces yellow. The primary colors at this level are red, green, and blue."}],"explainers":[],"slug":"additive-color-mixing","term":"additive color mixing"},{"definitions":[{"backrefs":[{"href":"041-colorwheel.html#term-041-colorwheel-4","label":"41","podNum":"41"}],"definition":"mixing pigments, where each pigment absorbs certain wavelengths. The primary colors at this level are closer to cyan, magenta, and yellow. The painter's intuition of red, yellow, blue is an approximation of this layer combined with the opponent channel layer above it."}],"explainers":[],"slug":"subtractive-color-mixing","term":"subtractive color mixing"},{"definitions":[{"backrefs":[{"href":"041-colorwheel.html#term-041-colorwheel-6","label":"41","podNum":"41"}],"definition":"the perceptual ability to see a surface as having a stable color across different lighting conditions. Believed to be a primary function of the blue-yellow opponent channel."}],"explainers":[],"slug":"color-constancy","term":"color constancy"},{"definitions":[{"backrefs":[{"href":"042-eyethinks.html","label":"42","podNum":"42"}],"definition":"the light-sensitive layer at the back of the eye, embryologically brain tissue that migrated outward; it computes, recombining cone signals into opponent channels before any signal leaves the eye."}],"explainers":[],"slug":"retina","term":"retina"},{"definitions":[{"backrefs":[{"href":"042-eyethinks.html","label":"42","podNum":"42"}],"definition":"recombination of cone signals into red\/green, blue\/yellow, and light\/dark channels within the retina."}],"explainers":[],"slug":"opponent-process","term":"opponent process"},{"definitions":[{"backrefs":[{"href":"044-ai-retina.html#term-044-ai-retina-1","label":"44","podNum":"44"}],"definition":"sensory systems are structured to optimally compress the statistics of natural inputs; predicts convergence of evolution and learning."}],"explainers":[],"slug":"efficient-coding-hypothesis","term":"efficient coding hypothesis"},{"definitions":[{"backrefs":[{"href":"045-baldwin.html","label":"45","podNum":"45"}],"definition":"adaptation within a lifetime rather than across generations; variation and selection running on synapses instead of genes."}],"explainers":[],"slug":"learning","term":"learning"},{"definitions":[{"backrefs":[{"href":"045-baldwin.html","label":"45","podNum":"45"}],"definition":"Selection for learnability narrows the genetic starting point until the trait appears innate; no Lamarckian inheritance required."}],"explainers":[],"slug":"baldwin-effect","term":"Baldwin effect"},{"definitions":[{"backrefs":[{"href":"045-baldwin.html#term-045-baldwin-2","label":"45","podNum":"45"}],"definition":"the unfolding of an organism from genetic starting point to mature form; the middle timescale between evolution and learning where selection's discoveries are expressed."}],"explainers":[],"slug":"development","term":"development"},{"definitions":[{"backrefs":[{"href":"046-thinkfast.html","label":"46","podNum":"46"}],"definition":"on the selectionist view, a candidate interpretation that has won its competition in the neural substrate; variation and selection running in milliseconds rather than generations."}],"explainers":[],"slug":"thought","term":"thought"},{"definitions":[{"backrefs":[{"href":"046-thinkfast.html","label":"46","podNum":"46"}],"definition":"the filter that keeps some variants and discards others; paired with variation, the complete algorithm that builds eyes, species, and possibly thoughts."}],"explainers":[],"slug":"selection","term":"selection"},{"definitions":[{"backrefs":[{"href":"046-thinkfast.html#term-046-thinkfast-1","label":"46","podNum":"46"}],"definition":"Edelman's view that the brain is a selectionist system; variants compete and the fitter achieve representation."}],"explainers":[],"slug":"neural-darwinism","term":"Neural Darwinism"},{"definitions":[{"backrefs":[{"href":"046-thinkfast.html#term-046-thinkfast-2","label":"46","podNum":"46"}],"definition":"Dennett's model in which content is determined by competition among parallel interpretations."}],"explainers":[],"slug":"multiple-drafts","term":"multiple drafts"},{"definitions":[{"backrefs":[{"href":"046-thinkfast.html#term-046-thinkfast-3","label":"46","podNum":"46"}],"definition":"the view that the brain is a prediction machine, continuously generating expectations and updating on prediction error rather than passively receiving input."}],"explainers":[],"slug":"predictive-processing","term":"predictive-processing"},{"definitions":[{"backrefs":[{"href":"047-ai-feeling.html#term-047-ai-feeling-2","label":"47","podNum":"47"}],"definition":"the view that mental states are defined by their causal role; the \"feeling vs. functioning\" distinction may not survive better understanding."}],"explainers":[],"slug":"functionalism","term":"functionalism"},{"definitions":[{"backrefs":[{"href":"048-flashes.html","label":"48","podNum":"48"}],"definition":"the sense of an unbroken stream; in consciousness, substantially a narrative construction laid over discrete flashes of experience."}],"explainers":[],"slug":"continuity","term":"continuity"},{"definitions":[{"backrefs":[{"href":"048-flashes.html","label":"48","podNum":"48"}],"definition":"the story a mind tells to bind scattered episodes into one continuous life; the stitching that makes flickering experience feel unbroken."}],"explainers":[],"slug":"narrative","term":"narrative"},{"definitions":[{"backrefs":[{"href":"048-flashes.html#term-048-flashes-1","label":"48","podNum":"48"}],"definition":"the constructed sense of continuous identity from memory and habit, despite discrete or gappy experience."}],"explainers":[],"slug":"narrative-self","term":"narrative self"},{"definitions":[{"backrefs":[{"href":"049-strangeloop.html#term-049-strangeloop-1","label":"49","podNum":"49"}],"definition":"Hofstadter's term for a system that, in the course of its operation, encounters or includes itself."}],"explainers":[],"slug":"strange-loop","term":"strange loop"},{"definitions":[{"backrefs":[{"href":"050-orthogonal.html#term-050-orthogonal-1","label":"50","podNum":"50"}],"definition":"inquiry into what fundamentally exists, beyond what observation alone can settle; a claim is dismissed as \"metaphysical\" when no test could bear on it."}],"explainers":[],"slug":"metaphysics","term":"metaphysics"},{"definitions":[{"backrefs":[{"href":"050-orthogonal.html#term-050-orthogonal-3","label":"50","podNum":"50"}],"definition":"Teilhard de Chardin's term for the interior aspect of matter, present from the beginning."}],"explainers":[],"slug":"within","term":"Within"},{"definitions":[{"backrefs":[{"href":"051-spacetime.html","label":"51","podNum":"51"}],"definition":"the quantum linkage in which systems share a single state, so that measuring one constrains the other regardless of distance; in emergent-spacetime proposals, the thread from which geometry is woven."}],"explainers":[],"slug":"entanglement","term":"entanglement"},{"definitions":[{"backrefs":[{"href":"051-spacetime.html#term-051-spacetime-1","label":"51","podNum":"51"},{"href":"067-monads-holons.html#term-067-monads-holons-2","label":"67","podNum":"67"},{"href":"068-bubbles.html#term-068-bubbles-1","label":"68","podNum":"68"}],"definition":"the information in a region scales with its boundary area, not volume; the interior is what the boundary does. Suggests space is emergent."}],"explainers":[],"slug":"holographic-principle","term":"holographic principle"},{"definitions":[{"backrefs":[{"href":"051-spacetime.html#term-051-spacetime-2","label":"51","podNum":"51"}],"definition":"the 2013 conjecture by Maldacena and Susskind that the Einstein-Rosen bridge (wormhole) and the Einstein-Podolsky-Rosen entanglement are the same phenomenon described two ways. Implies that entanglement is literally wormhole connectivity."}],"explainers":[],"slug":"er-epr","term":"ER-EPR"},{"definitions":[{"backrefs":[{"href":"052-dichotomy.html#term-052-dichotomy-1","label":"52","podNum":"52"}],"definition":"the apparent opposition between step-like and smooth accounts of reality; quantum field theory dissolves it: the field is continuous, its excitations discrete."}],"explainers":[],"slug":"discrete-continuous","term":"discrete-continuous"},{"definitions":[{"backrefs":[{"href":"053-dimensions.html#term-053-dimensions-1","label":"53","podNum":"53"}],"definition":"The result that high-dimensional data can be projected to lower dimension while approximately preserving distances; exponential in d directions."}],"explainers":[],"slug":"johnson-lindenstrauss","term":"Johnson-Lindenstrauss"},{"definitions":[{"backrefs":[{"href":"053-dimensions.html#term-053-dimensions-2","label":"53","podNum":"53"},{"href":"057-superfarey.html#term-057-superfarey-3","label":"57","podNum":"57"}],"definition":"The complexity level in the Farey hierarchy; used here as a principled threshold for \"nearly orthogonal,\" determining how many concepts fit at each level."}],"explainers":[],"slug":"farey-depth","term":"Farey depth"},{"definitions":[{"backrefs":[{"href":"054-bornharmonic.html","label":"54","podNum":"54"},{"href":"062-branchingdice.html#term-062-branchingdice-4","label":"62","podNum":"62"},{"href":"064-choicedimension.html","label":"64","podNum":"64"}],"definition":"the natural probability measure on the Mandelbrot boundary; uniform 1\/n at each n-fold branch favors simpler (more consonant) branches."}],"explainers":[],"slug":"harmonic-measure","term":"harmonic measure"},{"definitions":[{"backrefs":[{"href":"054-bornharmonic.html#term-054-bornharmonic-1","label":"54","podNum":"54"}],"definition":"The quantum postulate that measurement outcome probability is the squared amplitude; origin remains unexplained."}],"explainers":[],"slug":"born-rule","term":"Born rule"},{"definitions":[{"backrefs":[{"href":"054-bornharmonic.html#term-054-bornharmonic-2","label":"54","podNum":"54"},{"href":"060-worldtests.html","label":"60","podNum":"60"}],"definition":"the physics of the smallest scales, where states superpose, measurement outcomes are probabilistic, and the wavefunction evolves deterministically in between."}],"explainers":[],"slug":"quantum-mechanics","term":"quantum-mechanics"},{"definitions":[{"backrefs":[{"href":"055-patience.html#term-055-patience-3","label":"55","podNum":"55"}],"definition":"Whitehead's term for the pull each actual occasion feels toward the best possibility available to it. Not compulsion: the occasion is free to deviate. But the lure is always there, always pointing toward greater depth of experience and integration. The direction-without-destination at the heart of process metaphysics."}],"explainers":[],"slug":"lure","term":"lure"},{"definitions":[{"backrefs":[{"href":"056-mandelneural.html","label":"56","podNum":"56"}],"definition":"the iterative adjustment of a neural network's weights against a loss function, gradient descent over data; the process whose dynamics carve basins of convergence in weight space."}],"explainers":[],"slug":"training","term":"training"},{"definitions":[{"backrefs":[{"href":"056-mandelneural.html#term-056-mandelneural-1","label":"56","podNum":"56"}],"definition":"the high-dimensional space of all possible network parameters; training is iteration in this space."}],"explainers":[],"slug":"weight-space","term":"weight space"},{"definitions":[{"backrefs":[{"href":"056-mandelneural.html#term-056-mandelneural-2","label":"56","podNum":"56"}],"definition":"region of initial conditions that converge to the same attractor; analog of Mandelbrot bulbs."}],"explainers":[],"slug":"basin-of-attraction","term":"basin of attraction"},{"definitions":[{"backrefs":[{"href":"056-mandelneural.html#term-056-mandelneural-3","label":"56","podNum":"56"}],"definition":"a trained model's capacity to handle inputs it never saw; the fine structure of what transfers and what does not."}],"explainers":[],"slug":"generalization","term":"generalization"},{"definitions":[{"backrefs":[{"href":"057-superfarey.html#term-057-superfarey-1","label":"57","podNum":"57"}],"definition":"storing more than d concepts in d dimensions by using nearly-orthogonal directions; studied in mechanistic interpretability."}],"explainers":[],"slug":"superposition","term":"superposition"},{"definitions":[{"backrefs":[{"href":"057-superfarey.html#term-057-superfarey-2","label":"57","podNum":"57"}],"definition":"the research program of reverse-engineering what a trained neural network's internal representations mean; its mechanistic branch aims at circuit-level explanation."}],"explainers":[],"slug":"interpretability","term":"interpretability"},{"definitions":[{"backrefs":[{"href":"058-galacticnets.html#term-058-galacticnets-1","label":"58","podNum":"58"}],"definition":"the surface whose information content defines the interior; galaxy and weight matrix as bounded regions."}],"explainers":[],"slug":"holographic-boundary","term":"holographic boundary"},{"definitions":[{"backrefs":[{"href":"061-babyuniverse.html#term-061-babyuniverse-1","label":"61","podNum":"61"}],"definition":"the oldest observable light, from 380,000 years after the Big Bang, when the universe first became transparent."}],"explainers":[],"slug":"cmb","term":"CMB"},{"definitions":[{"backrefs":[{"href":"061-babyuniverse.html#term-061-babyuniverse-2","label":"61","podNum":"61"}],"definition":"the early-universe phase of exponential expansion that amplified quantum fluctuations into cosmic structure."}],"explainers":[],"slug":"inflation","term":"inflation"},{"definitions":[{"backrefs":[{"href":"062-branchingdice.html#term-062-branchingdice-2","label":"62","podNum":"62"}],"definition":"at each Mandelbrot node, the number of branches equals the period of the bulb; fixed by local algebra."}],"explainers":[],"slug":"branching-number","term":"branching number"},{"definitions":[{"backrefs":[{"href":"062-branchingdice.html#term-062-branchingdice-3","label":"62","podNum":"62"}],"definition":"a measure of how possibility is distributed over alternatives; here, what falls out of giving each branch of an n-fold node an equal 1\/n share."}],"explainers":[],"slug":"probability","term":"probability"},{"definitions":[{"backrefs":[{"href":"063-mandelcrystals.html","label":"63","podNum":"63"}],"definition":"ordered but non-periodic structure; often with golden-ratio and Farey-related geometry."}],"explainers":[],"slug":"quasicrystal","term":"quasicrystal"},{"definitions":[{"backrefs":[{"href":"063-mandelcrystals.html#term-063-mandelcrystals-2","label":"63","podNum":"63"}],"definition":"A tree of rationals related to the Farey sequence; governs ordering and Mandelbrot boundary structure."}],"explainers":[],"slug":"stern-brocot-tree","term":"Stern-Brocot tree"},{"definitions":[{"backrefs":[{"href":"064-choicedimension.html","label":"64","podNum":"64"}],"definition":"the resolution of branching possibility into one actual path; proposed here as a dimension of reality with tree structure rather than metric structure."}],"explainers":[],"slug":"choice","term":"choice"},{"definitions":[{"backrefs":[{"href":"064-choicedimension.html","label":"64","podNum":"64"}],"definition":"algebra of branching trees with grafting rather than multiplication; candidate for a \"choice\" dimension."}],"explainers":[],"slug":"tree-algebra","term":"tree algebra"},{"definitions":[{"backrefs":[{"href":"065-feel-do.html#term-065-feel-do-2","label":"65","podNum":"65"}],"definition":"a being functionally identical to a conscious being but with no inner experience; used to argue function and feeling can come apart."}],"explainers":[],"slug":"philosophical-zombie","term":"philosophical zombie"},{"definitions":[{"backrefs":[{"href":"066-cosmicattractor.html","label":"66","podNum":"66"}],"definition":"in Whitehead's process theology, not a person who intervenes but the ground of possibility and the lure toward complexity; in dynamical-systems language, both initial condition and attractor."}],"explainers":[],"slug":"god","term":"god"},{"definitions":[{"backrefs":[{"href":"066-cosmicattractor.html#term-066-cosmicattractor-2","label":"66","podNum":"66"}],"definition":"Whitehead's lure, the pull each occasion feels toward the best possibility available; not compulsion but attraction."}],"explainers":[],"slug":"initial-aim","term":"initial aim"},{"definitions":[{"backrefs":[{"href":"067-monads-holons.html","label":"67","podNum":"67"}],"definition":"Leibniz's indivisible unit of experience; each contains a complete representation of the universe from its perspective."}],"explainers":[],"slug":"monad","term":"monad"},{"definitions":[{"backrefs":[{"href":"067-monads-holons.html#term-067-monads-holons-1","label":"67","podNum":"67"}],"definition":"Maldacena's correspondence: a gravitational theory in the bulk is equivalent to a quantum theory on the boundary; each boundary point encodes the interior."}],"explainers":[],"slug":"adscft","term":"AdS\/CFT"},{"definitions":[{"backrefs":[{"href":"068-bubbles.html","label":"68","podNum":"68"}],"definition":"knowing-again: the felt match between a perceived structure and one already carried, needing no inference; contrasted with puzzlement."}],"explainers":[],"slug":"recognition","term":"recognition"},{"definitions":[{"backrefs":[{"href":"069-love.html","label":"69","podNum":"69"}],"definition":"attraction, radiance, union, the dissolution of distance; read here as the interior of the same relational structure whose exterior physics describes as light."}],"explainers":[],"slug":"love","term":"love"},{"definitions":[{"backrefs":[{"href":"070-harmony.html#term-070-harmony-1","label":"70","podNum":"70"}],"definition":"A tuning system that closes the circle of fifths by distributing the Pythagorean comma equally across all twelve steps, trading intervallic purity for the freedom to modulate."}],"explainers":[],"slug":"equal-temperament","term":"equal temperament"},{"definitions":[{"backrefs":[{"href":"070-harmony.html#term-070-harmony-2","label":"70","podNum":"70"}],"definition":"A two-dimensional lattice of pitch relationships organized by thirds and fifths. Euler drew the lattice in 1739 as a bounded speculum musicum; the name Tonnetz, and the unbounded reading, come from Oettingen and Riemann roughly a century and a half later."}],"explainers":[],"slug":"tonnetz","term":"Tonnetz"},{"definitions":[{"backrefs":[{"href":"071-beauty.html","label":"71","podNum":"71"}],"definition":"the felt pull of significant structure, in the eye of the beholder and in the mathematics of the thing beheld; what the eye finds beautiful is a record of the structures that have mattered."}],"explainers":[],"slug":"beauty","term":"beauty"},{"definitions":[{"backrefs":[{"href":"071-beauty.html","label":"71","podNum":"71"}],"definition":"the Japanese aesthetic that finds beauty in imperfection, impermanence, and
